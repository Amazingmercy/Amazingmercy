
name: Update GitHub Stats

on:
  schedule:
    - cron: "30 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          card: stats
          options: username=Amazingmercy&show_icons=true&theme=transparent&hide_border=true
          path: profile/stats.svg

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          card: top-langs
          options: username=Amazingmercy&layout=compact&theme=transparent&hide_border=true&langs_count=8
          path: profile/top-langs.svg

      - name: Commit generated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/
          git diff --cached --quiet || git commit -m "chore: update GitHub stats"
          git push
```
